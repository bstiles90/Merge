name: engine

on:
  push:
    paths: ['engine/**', '.github/workflows/engine.yml']
  pull_request:
    paths: ['engine/**', '.github/workflows/engine.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl-dev pkg-config xvfb ninja-build

      - name: Configure
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'Linux' && '-G Ninja' || '' }}

      - name: Build
        run: cmake --build engine/build --config Release --parallel 4

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a "engine/build/MergeEngine_artefacts/Release/Merge Engine" --selftest --plugin "$PWD/engine/build/testplugin/MergeTestGain_artefacts/Release/VST3/Merge Test Gain.vst3"

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: '"engine/build/MergeEngine_artefacts/Release/Merge Engine.app/Contents/MacOS/Merge Engine" --selftest --plugin "$PWD/engine/build/testplugin/MergeTestGain_artefacts/Release/VST3/Merge Test Gain.vst3"'

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: '"engine/build/MergeEngine_artefacts/Release/Merge Engine.exe" --selftest --plugin "$PWD/engine/build/testplugin/MergeTestGain_artefacts/Release/VST3/Merge Test Gain.vst3"'

      # Zip the .app with ditto so it keeps its executable bit and code signature
      # (artifact zips otherwise strip permissions and the app won't open)
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "engine/build/MergeEngine_artefacts/Release/Merge Engine.app" "dist/Merge Engine (macOS).zip"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Merge-Engine-macOS
          path: dist/

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: merge-engine-${{ runner.os }}
          path: |
            engine/build/MergeEngine_artefacts/Release
            engine/build/testplugin/MergeTestGain_artefacts/Release/VST3

  # Publish a rolling "Latest build" pre-release (replaced on every successful push),
  # so builds can be downloaded from the Releases page without signing in.
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp "artifacts/Merge-Engine-macOS/Merge Engine (macOS).zip" "dist/Merge-Engine-macOS.zip"
          (cd artifacts/merge-engine-Windows && zip -qr ../../dist/Merge-Engine-Windows.zip .)
          (cd artifacts/merge-engine-Linux && zip -qr ../../dist/Merge-Engine-Linux.zip .)
          ls -l dist

      - name: Publish "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          cat > notes.md <<NOTES
          Automatic build of \`$GITHUB_REF_NAME\` at $SHORT. All self-tests passed on macOS, Windows and Linux.

          **To try Merge on a Mac**
          1. Download **Merge-Engine-macOS.zip** below, unzip it and drag **Merge Engine.app** into Applications.
             First launch: System Settings → Privacy & Security → **Open Anyway**, and allow microphone access.
          2. Download **Source code (zip)** below (that's the console), unzip it, open the \`mac\` folder and
             double-click **Start Merge.command** (needs Node.js LTS from nodejs.org).
          3. In the console click **Connect engine**.

          Unsigned test build: not notarized by Apple yet.
          NOTES
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/* \
            --target "$GITHUB_SHA" \
            --title "Latest build ($SHORT)" \
            --notes-file notes.md \
            --prerelease
