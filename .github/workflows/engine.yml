name: engine

on:
  push:
    paths: ['engine/**', 'src/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', '.github/workflows/engine.yml']
  pull_request:
    paths: ['engine/**', 'src/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', '.github/workflows/engine.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The console UI is bundled into the app, so build it first
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build console UI
        shell: bash
        env:
          # shown in the app: "1.0.0" for a stable release (tag v1.0.0), "Beta abc1234" otherwise
          MERGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Beta {0}', github.sha) }}
        run: |
          case "$MERGE_VERSION" in v*) export MERGE_VERSION="${MERGE_VERSION#v}";; Beta*) export MERGE_VERSION="${MERGE_VERSION:0:12}";; esac
          npm ci
          npm test
          npm run build

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl-dev libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config xvfb ninja-build

      - name: WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory C:\webview2

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA="-G Ninja"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA="-DJUCE_WEBVIEW2_PACKAGE_LOCATION=C:/webview2"; fi
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build engine/build --config Release --parallel 4

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a engine/build/MergeEngine_artefacts/Release/Merge --selftest --plugin "$PWD/engine/build/testplugin/MergeTestGain_artefacts/Release/VST3/Merge Test Gain.vst3"

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: engine/build/MergeEngine_artefacts/Release/Merge.app/Contents/MacOS/Merge --selftest --plugin "$PWD/engine/build/testplugin/MergeTestGain_artefacts/Release/VST3/Merge Test Gain.vst3"

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: engine/build/MergeEngine_artefacts/Release/Merge.exe --selftest --plugin "$PWD/engine/build/testplugin/MergeTestGain_artefacts/Release/VST3/Merge Test Gain.vst3"

      # Launch the real app on macOS: the embedded console must load, connect to the engine,
      # and load a real VST3 into a rack (test show with the test plugin on ch 1)
      - name: App launch + plugin load check (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=engine/build/MergeEngine_artefacts/Release/Merge.app
          test -f "$APP/Contents/Resources/ui/index.html"
          # the signature must cover the whole bundle, or a downloaded copy shows "damaged"
          codesign --verify --deep --strict --verbose=2 "$APP"
          PLUGIN_ID=$("$APP/Contents/MacOS/Merge" --print-plugin-ids | grep "Merge Test Gain" | cut -f1 | head -1)
          echo "test plugin id: $PLUGIN_ID"
          test -n "$PLUGIN_ID"
          mkdir -p "$HOME/Library/Merge"  # Merge's data folder on macOS
          python3 engine/ci/make_dock_test_show.py "$PLUGIN_ID" "$HOME/Library/Merge/current-show.merge.json"
          # a big plugin collection: the list sent to the console is > 1 MB (WebKit's message limit)
          python3 engine/ci/add_many_plugins.py "$HOME/Library/Merge/plugins.xml" 8000
          "$APP/Contents/MacOS/Merge" > app.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do grep -q "UI client connected" app.log && break; sleep 1; done
          osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $PID) to true" || true
          for i in $(seq 1 60); do grep -q "\[insert\] ready Merge" app.log && break; sleep 1; done
          sleep 3
          screencapture -x app-screenshot.png || true
          kill $PID || true
          cat app.log
          grep -q "UI client connected" app.log
          # the console must stay connected (a message the web view refuses makes it drop and reconnect)
          test "$(grep -c "UI client connected" app.log)" -eq 1
          grep -q "\[plan\]" app.log   # the console sent its mix (audio)
          grep -q "\[insert\] ready Merge Test Gain" app.log

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && always()
        with:
          name: macOS-app-screenshot
          path: app-screenshot.png
          if-no-files-found: ignore

      # macOS: a .dmg (drag Merge into Applications). ditto/hdiutil keep the app's permissions and signature.
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg dist
          ditto engine/build/MergeEngine_artefacts/Release/Merge.app dmg/Merge.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Merge" -srcfolder dmg -ov -format UDZO "dist/Merge-macOS.dmg"
          # check the app inside the finished .dmg still verifies
          hdiutil attach -nobrowse -mountpoint /tmp/mergedmg "dist/Merge-macOS.dmg"
          codesign --verify --deep --strict --verbose=2 /tmp/mergedmg/Merge.app
          hdiutil detach /tmp/mergedmg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Merge-macOS
          path: dist/

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: merge-${{ runner.os }}
          path: engine/build/MergeEngine_artefacts/Release

  # Every push publishes the rolling "Beta" pre-release (replaced each time). A version tag
  # (git tag v1.0.0) publishes a permanent stable release, "Merge 1.0.0", marked Latest.
  release:
    # one publish at a time (several pushes close together would otherwise race)
    concurrency:
      group: latest-build-release
      cancel-in-progress: false
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp artifacts/Merge-macOS/Merge-macOS.dmg dist/
          (cd artifacts/merge-Windows && zip -qr ../../dist/Merge-Windows.zip .)
          (cd artifacts/merge-Linux && zip -qr ../../dist/Merge-Linux.zip .)
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            HEADLINE="Stable release **Merge $VERSION** ($SHORT)."
            WARN="*Not signed by Apple, so a new version needs \"Open Anyway\" once.*"
          else
            HEADLINE="Beta build of \`$GITHUB_REF_NAME\` at $SHORT: the newest work, not yet marked stable. For Sunday services use the release marked **Latest**."
            WARN="*Beta build, not signed by Apple, so each new version needs \"Open Anyway\" once.*"
          fi
          cat > notes.md <<NOTES
          $HEADLINE All self-tests passed on macOS, Windows and Linux,
          and the Mac app was launched and its console connected to the engine.

          **Install on a Mac**
          1. Download **Merge-macOS.dmg** below and open it.
          2. Drag **Merge** onto **Applications**.
          3. Open Merge from Applications. The first time, macOS blocks it: go to
             **System Settings → Privacy & Security** and click **Open Anyway**. Allow microphone access
             (that's how Merge hears your audio interface / BlackHole).

          That's it: one app, no browser or Node.js needed. Your show reopens automatically next time.

          $WARN
          NOTES
          # GitHub's API sometimes answers 500/502: retry a few times before giving up
          for attempt in 1 2 3 4 5; do
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              gh release delete "$GITHUB_REF_NAME" --yes || true
              gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Merge $VERSION" --notes-file notes.md --latest && exit 0
            else
              # the old rolling release name, replaced by "beta"
              gh release delete latest-build --yes --cleanup-tag || true
              gh release delete beta --yes --cleanup-tag || true
              gh release create beta dist/* --target "$GITHUB_SHA" --title "Beta ($SHORT)" --notes-file notes.md --prerelease --latest=false && exit 0
            fi
            echo "publish attempt $attempt failed; retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done
          exit 1
